<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NSTUDY 로그인</title>
<style>
body{font-family:'Malgun Gothic',sans-serif;background:#f3f6fb;margin:0;color:#19283b}
.wrap{max-width:480px;margin:7vh auto;background:white;border-radius:16px;box-shadow:0 8px 40px #152d4818;overflow:visible}
header{background:#101d39;color:white;padding:24px;text-align:center;font-size:25px;font-weight:800;border-radius:16px 16px 0 0}
main{padding:28px}label{display:block;margin:14px 0 6px;font-weight:700}
input,select,button{box-sizing:border-box;width:100%;padding:13px;border-radius:7px;border:1px solid #cdd6e4;font-size:16px}
button{background:#1769e0;color:white;border:0;font-weight:800;margin-top:20px;cursor:pointer}
.tabs{display:flex;gap:8px}.tabs button{margin:0;background:#e8eef8;color:#234}.tabs button.active{background:#1769e0;color:#fff}
.hidden{display:none!important}button:disabled{opacity:.6;cursor:wait}.helper{font-size:13px;color:#586a81;line-height:1.6}.text-action{width:auto;padding:6px 0;margin-top:10px;border:0;background:transparent;color:#1769e0;font-size:14px;text-decoration:underline}.success{color:#166534!important}#msg{color:#a32929;margin-top:15px;white-space:pre-wrap}.foot{text-align:center;margin-top:20px}a{color:#1769e0}
.school-search{position:relative}.school-hint{font-size:12px;color:#687487;margin-top:5px;line-height:1.5}
.school-results{position:absolute;top:100%;left:0;right:0;z-index:20;max-height:260px;overflow-y:auto;background:#fff;border:1px solid #b8c8e0;border-radius:8px;box-shadow:0 12px 28px #152d4826;margin-top:3px;list-style:none;padding:4px}
.school-results li{margin:0}.school-results button{display:block;text-align:left;background:#fff;color:#19283b;margin:0;border:0;border-radius:5px;font-weight:400;padding:10px 12px}
.school-results button:hover,.school-results button:focus{background:#edf4ff;outline:2px solid #a9c7f8;outline-offset:-2px}
.school-name{display:block;font-size:14px;font-weight:700}.school-meta{display:block;color:#62718a;font-size:12px;margin-top:2px}
.school-empty{padding:12px;color:#687487;font-size:13px}
@media(max-width:520px){.wrap{margin:0;min-height:100vh;border-radius:0}header{border-radius:0}main{padding:22px}}
</style>
</head>
<body><div class="wrap"><header>NSTUDY 로그인</header><main>
<div class="tabs"><button type="button" id="loginTab" class="active">로그인</button><button type="button" id="signupTab">회원가입</button></div>
<form id="login"><label for="email">이메일</label><input id="email" type="email" required autocomplete="email"><label for="password">비밀번호</label><input id="password" type="password" required autocomplete="current-password"><button type="submit">로그인</button><button type="button" class="text-action" id="forgotButton">비밀번호를 잊으셨나요?</button></form>
<form id="signup" class="hidden">
<label for="username">아이디</label><input id="username" minlength="4" required>
<label for="newEmail">이메일</label><input id="newEmail" type="email" required>
<label for="newPassword">비밀번호</label><input id="newPassword" type="password" minlength="6" required>
<label for="memberType">회원 유형</label><select id="memberType"><option>학생</option><option>학부모</option><option>강사</option></select>
<label for="fullName">성명</label><input id="fullName" required>
<label for="school">학교</label>
<div class="school-search" id="schoolSearch">
<input id="school" type="text" autocomplete="off" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="schoolResults" placeholder="지역 또는 학교명 입력 (예: 부산)">
<ul id="schoolResults" class="school-results hidden" role="listbox" aria-label="학교 자동추천"></ul>
</div>
<p class="school-hint">지역명 또는 학교명을 입력하면 학교 유형과 함께 추천됩니다. 목록에 없는 학교는 직접 입력할 수 있습니다.</p>
<label for="grade">학년</label><input id="grade">
<label for="phone">전화번호</label><input id="phone" type="tel">
<label for="address">주소</label><input id="address">
<button type="submit">회원가입</button></form>
<form id="resetRequest" class="hidden"><h3>비밀번호 재설정</h3><p class="helper">회원가입 때 사용한 이메일을 입력하면 비밀번호 변경 링크를 보내드립니다.</p><label for="resetEmail">가입 이메일</label><input id="resetEmail" type="email" required autocomplete="email"><button type="submit">재설정 이메일 보내기</button><button type="button" class="text-action" id="backLogin1">로그인으로 돌아가기</button></form>
<form id="resetPassword" class="hidden"><h3>새 비밀번호 설정</h3><p class="helper">이메일에서 받은 링크를 통해 접속하셨습니다.</p><label for="resetNewPassword">새 비밀번호 (8자 이상)</label><input id="resetNewPassword" type="password" minlength="8" maxlength="72" autocomplete="new-password" required><label for="resetConfirmPassword">새 비밀번호 확인</label><input id="resetConfirmPassword" type="password" minlength="8" maxlength="72" autocomplete="new-password" required><button type="submit">새 비밀번호 저장</button></form>
<p id="msg" role="status"></p><div class="foot"><a href="./index.html">홈페이지로 돌아가기</a></div>
</main></div>
<script type="module">
import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
const db=createClient('https://ljjurwyhhbokrkcbfqwh.supabase.co','sb_publishable_wG_7bLxeoVA1DY35GPK0yA_GsXYGODM'),$=x=>document.getElementById(x),msg=s=>$('msg').textContent=s;
const dest=new URLSearchParams(location.search).get('return');
const target=['index.html','02-bank.html'].includes(dest)?dest:'index.html';
function tab(signup){$('resetRequest').classList.add('hidden');$('resetPassword').classList.add('hidden');$('signup').classList.toggle('hidden',!signup);$('login').classList.toggle('hidden',signup);$('signupTab').classList.toggle('active',signup);$('loginTab').classList.toggle('active',!signup);closeSuggestions();msg('')}
$('loginTab').onclick=()=>tab(false);$('signupTab').onclick=()=>tab(true);
// 예시로 제공하는 일부 실제 학교입니다. 전체 학교 목록이 아니며, 사용자가 직접 입력할 수도 있습니다.
const SCHOOLS=[
 {name:'부산기계공업고등학교',region:'부산',type:'마이스터고'},
 {name:'부산자동차고등학교',region:'부산',type:'마이스터고'},
 {name:'부산소프트웨어마이스터고등학교',region:'부산',type:'마이스터고'},
 {name:'부산전자공업고등학교',region:'부산',type:'특성화고'},
 {name:'부산대학교',region:'부산',type:'대학교'},
 {name:'국립부경대학교',region:'부산',type:'대학교'},
 {name:'동아대학교',region:'부산',type:'대학교'},
 {name:'동의대학교',region:'부산',type:'대학교'},
 {name:'경성대학교',region:'부산',type:'대학교'},
 {name:'신라대학교',region:'부산',type:'대학교'}
];
const schoolInput=$('school'),results=$('schoolResults');
function closeSuggestions(){results.classList.add('hidden');results.replaceChildren();schoolInput.setAttribute('aria-expanded','false')}
function chooseSchool(name){schoolInput.value=name;closeSuggestions();schoolInput.focus()}
function showSuggestions(){
 const q=schoolInput.value.trim().toLocaleLowerCase('ko');
 results.replaceChildren();
 if(!q){closeSuggestions();return}
 const matches=SCHOOLS.filter(s=>[s.name,s.region,s.type].some(v=>v.toLocaleLowerCase('ko').includes(q))).slice(0,12);
 if(!matches.length){const li=document.createElement('li');li.className='school-empty';li.textContent='추천 학교가 없습니다. 학교명을 직접 입력해 주세요.';results.appendChild(li)}
 else matches.forEach(s=>{
  const li=document.createElement('li');li.setAttribute('role','option');
  const btn=document.createElement('button');btn.type='button';
  const name=document.createElement('span');name.className='school-name';name.textContent=s.name;
  const meta=document.createElement('span');meta.className='school-meta';meta.textContent=s.region+' · '+s.type;
  btn.append(name,meta);btn.addEventListener('mousedown',e=>e.preventDefault());btn.addEventListener('click',()=>chooseSchool(s.name));li.appendChild(btn);results.appendChild(li);
 });
 results.classList.remove('hidden');schoolInput.setAttribute('aria-expanded','true');
}
schoolInput.addEventListener('input',showSuggestions);
schoolInput.addEventListener('focus',showSuggestions);
schoolInput.addEventListener('keydown',e=>{if(e.key==='Escape')closeSuggestions();if(e.key==='ArrowDown'&&!results.classList.contains('hidden')){const first=results.querySelector('button');if(first){e.preventDefault();first.focus()}}});
results.addEventListener('keydown',e=>{const buttons=[...results.querySelectorAll('button')];const idx=buttons.indexOf(document.activeElement);if(e.key==='ArrowDown'&&idx<buttons.length-1){e.preventDefault();buttons[idx+1].focus()}else if(e.key==='ArrowUp'){e.preventDefault();if(idx>0)buttons[idx-1].focus();else schoolInput.focus()}else if(e.key==='Escape'){closeSuggestions();schoolInput.focus()}});
document.addEventListener('click',e=>{if(!$('schoolSearch').contains(e.target))closeSuggestions()});
// 회원가입·로그인 중복 전송 방지와 사용자 친화적인 오류 표시
function errorText(error){
 const code=String(error?.code||'').toLowerCase(),s=String(error?.message||'').toLowerCase();
 if(code.includes('over_email_send_rate_limit')||s.includes('rate limit')||s.includes('too many'))return '요청이 너무 많습니다. 잠시 후 다시 시도해 주세요.';
 if(s.includes('already registered')||s.includes('already been registered')||s.includes('already exists')||s.includes('duplicate'))return '이미 사용 중인 이메일 또는 아이디일 수 있습니다. 기존 계정으로 로그인하거나 비밀번호를 재설정해 주세요.';
 if(s.includes('password')&&(s.includes('weak')||s.includes('short')||s.includes('least')))return '비밀번호가 보안 기준에 맞지 않습니다. 8자 이상으로 다시 입력해 주세요.';
 if(s.includes('invalid email'))return '이메일 주소 형식을 확인해 주세요.';
 if(s.includes('database error')||s.includes('saving new user'))return '회원정보 저장 과정에서 서버 오류가 발생했습니다. 관리자에게 문의해 주세요.';
 if(s.includes('failed to fetch')||s.includes('network')||s.includes('timeout'))return '인터넷 연결 또는 서버 응답에 문제가 있습니다. 연결 상태를 확인해 주세요.';
 if(s.includes('invalid login credentials'))return '이메일 또는 비밀번호를 확인해 주세요.';
 return '처리 중 오류가 발생했습니다. ('+String(error?.message||'알 수 없는 오류')+')';
}
async function locked(form,action){const b=form.querySelector('button[type="submit"]');if(b.disabled)return;b.disabled=true;try{await action()}catch(e){console.error('NSTUDY auth error',e);msg(errorText(e))}finally{b.disabled=false}}
async function waitForProfile(id){for(let i=0;i<4;i++){const {data,error}=await db.from('nstudy_profiles').select('id,blocked').eq('id',id).maybeSingle();if(error)throw error;if(data)return data;await new Promise(r=>setTimeout(r,500*(i+1)))}return null}
$('login').onsubmit=e=>{e.preventDefault();locked($('login'),async()=>{
 msg('로그인 확인 중...');const {data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});
 if(error)throw error;
 const p=await waitForProfile(data.user.id);
 if(!p){await db.auth.signOut();msg('로그인 계정은 있으나 회원 프로필을 확인할 수 없습니다. 관리자에게 문의해 주세요.');return}
 if(p.blocked){await db.auth.signOut();msg('로그인이 제한된 계정입니다.');return}
 location.href='./'+target;
})};
$('signup').onsubmit=e=>{e.preventDefault();locked($('signup'),async()=>{
 msg('회원가입 처리 중...');const email=$('newEmail').value.trim().toLowerCase(),password=$('newPassword').value,username=$('username').value.trim().toLowerCase();
 if(!/^[a-z0-9][a-z0-9_.-]{3,29}$/.test(username)){msg('아이디는 영문 소문자, 숫자, 점, 밑줄, 하이픈으로 4~30자 입력해 주세요.');return}
 if(password.length<8){msg('비밀번호는 8자 이상 입력해 주세요.');return}
 const metadata={username,member_type:$('memberType').value,full_name:$('fullName').value.trim(),school:$('school').value.trim(),grade:$('grade').value.trim(),phone:$('phone').value.trim(),address:$('address').value.trim()};
 const {data,error}=await db.auth.signUp({email,password,options:{data:metadata,emailRedirectTo:new URL('./001-login.html',location.href).href}});
 if(error)throw error;
 if(!data?.user){msg('가입 결과를 확인할 수 없습니다. 같은 정보로 반복 가입하지 말고 관리자에게 문의해 주세요.');return}
 if(!data.session){msg('가입 요청이 접수되었습니다. 이메일 인증이 활성화되어 있다면 받은 메일의 인증 링크를 확인해 주세요. 이미 가입된 이메일인 경우에도 동일하게 안내될 수 있습니다.');return}
 const p=await waitForProfile(data.user.id);
 if(!p){msg('로그인 계정은 생성됐지만 회원 프로필을 확인하지 못했습니다. 다시 회원가입하지 말고 관리자에게 문의해 주세요.');return}
 msg('회원가입이 완료되었습니다.');location.href='./'+target;
})};
function showReset(mode){$('login').classList.add('hidden');$('signup').classList.add('hidden');$('resetRequest').classList.toggle('hidden',mode!=='request');$('resetPassword').classList.toggle('hidden',mode!=='password');document.querySelector('.tabs').classList.add('hidden');msg('')}
$('forgotButton').onclick=()=>{showReset('request');$('resetEmail').value=$('email').value.trim()};
$('backLogin1').onclick=()=>{document.querySelector('.tabs').classList.remove('hidden');tab(false)};
$('resetRequest').onsubmit=e=>{e.preventDefault();locked($('resetRequest'),async()=>{
 msg('재설정 이메일 발송 중...');const email=$('resetEmail').value.trim();
 const redirectTo=new URL('./001-login.html',location.href).href;
 const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo});if(error)throw error;
 msg('이메일이 등록되어 있고 발송이 허용된 경우 재설정 링크가 전송됩니다. 받은편지함과 스팸함을 확인해 주세요.');
})};
let recovery=false;
db.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY'){recovery=true;showReset('password')}});
// 링크로 이동한 시점에 인증 이벤트가 먼저 발생한 경우를 위한 보완
if(new URLSearchParams(location.search).get('type')==='recovery'||new URLSearchParams(location.hash.slice(1)).get('type')==='recovery'){
 db.auth.getSession().then(({data})=>{if(data?.session){recovery=true;showReset('password')}});
}
$('resetPassword').onsubmit=e=>{e.preventDefault();locked($('resetPassword'),async()=>{
 const pw=$('resetNewPassword').value;
 if(pw!==$('resetConfirmPassword').value){msg('새 비밀번호와 확인 비밀번호가 일치하지 않습니다.');return}
 if(pw.length<8||pw.length>72){msg('비밀번호는 8~72자로 입력해 주세요.');return}
 const {data:{session}}=await db.auth.getSession();
 if(!session){msg('재설정 링크가 만료되었거나 유효하지 않습니다. 재설정 이메일을 다시 요청해 주세요.');return}
 const {error}=await db.auth.updateUser({password:pw});if(error)throw error;
 recovery=false;await db.auth.signOut();$('resetPassword').reset();document.querySelector('.tabs').classList.remove('hidden');tab(false);msg('비밀번호가 변경되었습니다. 새 비밀번호로 로그인해 주세요.');
})};
</script></body></html>
