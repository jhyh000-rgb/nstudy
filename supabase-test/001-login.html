<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NSTUDY 로그인</title><style>body{font-family:'Malgun Gothic',sans-serif;background:#f3f6fb;margin:0;color:#19283b}.wrap{max-width:480px;margin:7vh auto;background:white;border-radius:16px;box-shadow:0 8px 40px #152d4818;overflow:hidden}header{background:#101d39;color:white;padding:24px;text-align:center;font-size:25px;font-weight:800}main{padding:28px}label{display:block;margin:14px 0 6px;font-weight:700}input,select,button{box-sizing:border-box;width:100%;padding:13px;border-radius:7px;border:1px solid #cdd6e4;font-size:16px}button{background:#1769e0;color:white;border:0;font-weight:800;margin-top:20px;cursor:pointer}.tabs{display:flex;gap:8px}.tabs button{margin:0;background:#e8eef8;color:#234}.tabs button.active{background:#1769e0;color:#fff}.hidden{display:none}#msg{color:#a32929;margin-top:15px;white-space:pre-wrap}.foot{text-align:center;margin-top:20px}a{color:#1769e0}</style></head><body><div class="wrap"><header>NSTUDY 로그인</header><main><div class="tabs"><button id="loginTab" class="active">로그인</button><button id="signupTab">회원가입</button></div><form id="login"><label>이메일</label><input id="email" type="email" required autocomplete="email"><label>비밀번호</label><input id="password" type="password" required autocomplete="current-password"><button>로그인</button></form><form id="signup" class="hidden"><label>아이디</label><input id="username" minlength="4" required><label>이메일</label><input id="newEmail" type="email" required><label>비밀번호</label><input id="newPassword" type="password" minlength="6" required><label>회원 유형</label><select id="memberType"><option>학생</option><option>학부모</option><option>강사</option></select><label>성명</label><input id="fullName" required><label>학교</label><input id="school"><label>학년</label><input id="grade"><label>전화번호</label><input id="phone" type="tel"><label>주소</label><input id="address"><button>회원가입</button></form><p id="msg" role="status"></p><div class="foot"><a href="./index.html">홈페이지로 돌아가기</a></div></main></div><script type="module">import{createClient}from'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';const db=createClient('https://ljjurwyhhbokrkcbfqwh.supabase.co','sb_publishable_wG_7bLxeoVA1DY35GPK0yA_GsXYGODM'),$=x=>document.getElementById(x),msg=s=>$('msg').textContent=s;const dest=new URLSearchParams(location.search).get('return');const target=['index.html','02-bank.html'].includes(dest)?dest:'index.html';function tab(signup){$('signup').classList.toggle('hidden',!signup);$('login').classList.toggle('hidden',signup);$('signupTab').classList.toggle('active',signup);$('loginTab').classList.toggle('active',!signup);msg('')}$('loginTab').onclick=()=>tab(false);$('signupTab').onclick=()=>tab(true);$('login').onsubmit=async e=>{e.preventDefault();msg('로그인 확인 중...');const{data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return msg('로그인 실패: '+error.message);const{data:p}=await db.from('nstudy_profiles').select('blocked').eq('id',data.user.id).maybeSingle();if(!p){await db.auth.signOut();return msg('회원 프로필이 없습니다. 3단계 SQL을 실행한 뒤 다시 가입하거나 관리자에게 문의해 주세요.');}if(p.blocked){await db.auth.signOut();return msg('로그인이 제한된 계정입니다.')}location.href='./'+target};$('signup').onsubmit=async e=>{e.preventDefault();msg('회원가입 처리 중...');const email=$('newEmail').value.trim(),password=$('newPassword').value,username=$('username').value.trim().toLowerCase();const metadata={username,member_type:$('memberType').value,full_name:$('fullName').value.trim(),school:$('school').value.trim(),grade:$('grade').value.trim(),phone:$('phone').value.trim(),address:$('address').value.trim()};const{data,error}=await db.auth.signUp({email,password,options:{data:metadata,emailRedirectTo:new URL('./001-login.html',location.href).href}});if(error)return msg('회원가입 실패: '+error.message);if(!data.session)return msg('인증 메일을 확인해 주세요. 이메일 인증 후 이 화면에서 로그인하시면 됩니다.');const{data:existing}=await db.from('nstudy_profiles').select('id').eq('id',data.user.id).maybeSingle();if(!existing)return msg('계정이 생성되었지만 프로필 생성이 확인되지 않았습니다. 3단계 SQL을 먼저 실행해 주세요.');msg('회원가입이 완료되었습니다.');location.href='./'+target};</script></body></html>
